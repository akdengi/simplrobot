<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>8-БИТНАЯ БИТВА ГОЛЕМОВ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Press Start 2P', cursive;
        background-color: #202020;
        color: #e5e5e5;
        overflow: hidden;
        touch-action: none;
      }
      
      .nes-container {
        border: 4px solid #ffffff;
        box-shadow: 
          -4px -4px 0 #ffffff, 
          4px -4px 0 #ffffff, 
          -4px 4px 0 #ffffff, 
          4px 4px 0 #ffffff;
        background-color: #000000;
      }

      @keyframes lunge {
        0% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
      }
      .animate-lunge {
        animation: lunge 0.3s steps(4);
      }

      @keyframes flash-damage {
        0%, 100% { filter: brightness(1) sepia(0); opacity: 1; }
        25% { filter: brightness(10) sepia(1) hue-rotate(-50deg) saturate(5); opacity: 0; }
        50% { filter: brightness(10) sepia(1) hue-rotate(-50deg) saturate(5); opacity: 1; }
        75% { filter: brightness(10) sepia(1) hue-rotate(-50deg) saturate(5); opacity: 0; }
      }
      .animate-damage {
        animation: flash-damage 0.5s steps(2);
        z-index: 50 !important;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border: 1px solid #000;
      }
    </style>
  </head>
