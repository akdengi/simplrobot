<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Голем идёт по маршруту с поворотами">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="50%" r="70%">
      <stop offset="0" stop-color="#2f6ea8" stop-opacity=".40"/>
      <stop offset="1" stop-color="#2f6ea8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bSide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bda764"/><stop offset="1" stop-color="#8d7a49"/>
    </linearGradient>
    <pattern id="check1" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#f1e5bb"/>
      <rect width="23" height="23" fill="#ddcb96"/>
      <rect x="23" y="23" width="23" height="23" fill="#ddcb96"/>
    </pattern>
    <g id="golem1">
      <ellipse cx="0" cy="58" rx="33" ry="8" fill="#060a12" opacity=".45"/>
      <rect x="-16" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="3" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="-35" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="22" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="-25" y="-2" width="50" height="46" rx="11" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="8" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-15" y="22" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-21" y="-36" width="42" height="33" rx="9" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="-29" width="30" height="17" rx="5" fill="#141c2b"/>
      <circle cx="-6" cy="-20" r="4" fill="#ffe9a8"/>
      <circle cx="6" cy="-20" r="4" fill="#ffe9a8"/>
      <rect x="-2" y="-47" width="4" height="12" rx="2" fill="#16202f"/>
      <circle cx="0" cy="-50" r="5" fill="#ffd166"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="180" rx="16" fill="#0e1626"/>
  <ellipse cx="300" cy="90" rx="430" ry="100" fill="url(#glow1)"/>

  <!-- полоса поля -->
  <g>
    <rect x="40" y="126" width="800" height="46" rx="10" fill="url(#bSide1)"/>
    <rect x="40" y="118" width="800" height="46" rx="10" fill="url(#check1)" stroke="#3a4a63" stroke-width="3"/>
  </g>

  <!-- маршрут: вперёд — поворот влево — вперёд — поворот — вперёд -->
  <path d="M110 96 L250 96 L250 52 L520 52 L520 96 L740 96" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>
  <path d="M232 88 L252 96 L232 104" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M242 70 L250 50 L258 70" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M502 70 L520 50 L538 70" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M502 88 L522 96 L502 104" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M722 88 L742 96 L722 104" fill="none" stroke="#7cb2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- повороты -->
  <g transform="translate(250,80)">
    <path d="M-11 -9 a13 13 0 1 1 -1 16" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M-16 4 l5 -9 6 8 z" fill="#ffd166"/>
  </g>
  <g transform="translate(520,80)">
    <path d="M11 -9 a13 13 0 1 0 1 16" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M16 4 l-5 -9 -6 8 z" fill="#ffd166"/>
  </g>

  <!-- цель -->
  <g transform="translate(762,96)">
    <circle r="20" fill="#bfe8b0" stroke="#57b45a" stroke-width="3"/>
    <circle r="11" fill="none" stroke="#57b45a" stroke-width="3"/>
    <circle r="4" fill="#57b45a"/>
  </g>

  <!-- компас -->
  <g transform="translate(816,42)">
    <circle r="26" fill="#131e33" stroke="#3a4a63" stroke-width="3"/>
    <path d="M0 -18 L7 4 L0 -1 L-7 4 Z" fill="#ff9a3c"/>
    <path d="M0 18 L5 4 L0 7 L-5 4 Z" fill="#7cb2ff"/>
    <circle r="3" fill="#e6eefc"/>
  </g>

  <use href="#golem1" transform="translate(72,104) scale(0.86)" style="color:#4f8fe2"/>
  <path d="M620 96 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" fill="#ffd166" opacity=".8"/>
</svg>
