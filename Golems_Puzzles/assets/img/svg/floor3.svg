<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Цикл: повторить команды дважды">
  <defs>
    <radialGradient id="g3" cx="35%" cy="55%" r="60%">
      <stop offset="0" stop-color="#2f8a6a" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f8a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brl3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a96c30"/><stop offset=".45" stop-color="#e3ab61"/><stop offset="1" stop-color="#9c6329"/>
    </linearGradient>
    <g id="golem3">
      <ellipse cx="0" cy="58" rx="33" ry="8" fill="#060a12" opacity=".45"/>
      <rect x="-16" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="3" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="-35" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="22" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="-25" y="-2" width="50" height="46" rx="11" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="8" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-15" y="22" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-21" y="-36" width="42" height="33" rx="9" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="-29" width="30" height="17" rx="5" fill="#141c2b"/>
      <circle cx="-6" cy="-20" r="4" fill="#ffe9a8"/>
      <circle cx="6" cy="-20" r="4" fill="#ffe9a8"/>
      <rect x="-2" y="-47" width="4" height="12" rx="2" fill="#16202f"/>
      <circle cx="0" cy="-50" r="5" fill="#ffd166"/>
    </g>
    <g id="barrel3">
      <ellipse cx="0" cy="24" rx="17" ry="5" fill="#000" opacity=".22"/>
      <rect x="-15" y="-18" width="30" height="40" rx="7" fill="url(#brl3)" stroke="#6b4520" stroke-width="2.6"/>
      <rect x="-16" y="-19" width="32" height="8" rx="4" fill="#c98f4c" stroke="#6b4520" stroke-width="2"/>
      <rect x="-16" y="12" width="32" height="8" rx="4" fill="#c98f4c" stroke="#6b4520" stroke-width="2"/>
      <rect x="-11" y="-11" width="5" height="8" rx="2.5" fill="#4f3a1e" opacity=".55"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="180" rx="16" fill="#0e1626"/>
  <ellipse cx="310" cy="96" rx="330" ry="110" fill="url(#g3)"/>

  <!-- виток цикла -->
  <path d="M300 14 A86 86 0 1 1 225 57" fill="none" stroke="#7cb2ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12"/>
  <path d="M212 66 l2 -22 18 14 z" fill="#7cb2ff"/>
  <path d="M300 44 A56 56 0 1 1 253 72" fill="none" stroke="#57b45a" stroke-width="5" stroke-linecap="round" stroke-dasharray="13 10" opacity=".9"/>
  <path d="M244 78 l1 -15 13 10 z" fill="#57b45a" opacity=".9"/>

  <!-- содержимое цикла: Голем за бочками -->
  <use href="#barrel3" transform="translate(248,96) scale(0.95)"/>
  <use href="#barrel3" transform="translate(354,96) scale(0.95)"/>
  <use href="#golem3" transform="translate(301,120) scale(0.74)" style="color:#57b45a"/>

  <!-- значок «×2» -->
  <g transform="translate(170,20)">
    <rect width="64" height="32" rx="16" fill="#131e33" stroke="#ffd166" stroke-width="3"/>
    <text x="32" y="22" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffd166">×2</text>
  </g>

  <!-- штабель бочек -->
  <use href="#barrel3" transform="translate(672,124) scale(1.05)"/>
  <use href="#barrel3" transform="translate(752,124) scale(1.05)"/>
  <use href="#barrel3" transform="translate(712,80) scale(1.05)"/>

  <!-- мини-карта «Цикл 2» -->
  <g transform="translate(556,26)">
    <rect width="62" height="78" rx="9" fill="#f5efe0" stroke="#2a3242" stroke-width="2.4"/>
    <path d="M0 9 a9 9 0 0 1 9 -9 h44 a9 9 0 0 1 9 9 v13 h-62 z" fill="#d8b23c"/>
    <path d="M40 12 a11 11 0 1 1 -9 -8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M29 5 l1 9 8 -4 z" fill="#fff"/>
    <text x="31" y="50" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="12" font-weight="700" fill="#2a3242">Цикл 2</text>
    <circle cx="51" cy="68" r="9" fill="#2a3242"/>
    <text x="51" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="11" font-weight="700" fill="#f5efe0">1</text>
  </g>
</svg>
