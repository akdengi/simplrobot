<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Шахматный этаж: Големы-противники на доске">
  <defs>
    <radialGradient id="g6a" cx="22%" cy="55%" r="55%">
      <stop offset="0" stop-color="#a83a34" stop-opacity=".42"/>
      <stop offset="1" stop-color="#a83a34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g6b" cx="78%" cy="55%" r="55%">
      <stop offset="0" stop-color="#2f6ea8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f6ea8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chess" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e6e0cf"/>
      <rect width="20" height="20" fill="#2c3446"/>
      <rect x="20" y="20" width="20" height="20" fill="#2c3446"/>
    </pattern>
    <g id="golem6">
      <ellipse cx="0" cy="58" rx="33" ry="8" fill="#060a12" opacity=".45"/>
      <rect x="-16" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="3" y="40" width="13" height="15" rx="3" fill="#2b3344"/>
      <rect x="-35" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="22" y="4" width="13" height="30" rx="6" fill="currentColor" stroke="#16202f" stroke-width="3"/>
      <rect x="-25" y="-2" width="50" height="46" rx="11" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="8" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-15" y="22" width="30" height="6" rx="3" fill="#000" opacity=".16"/>
      <rect x="-21" y="-36" width="42" height="33" rx="9" fill="currentColor" stroke="#16202f" stroke-width="4"/>
      <rect x="-15" y="-29" width="30" height="17" rx="5" fill="#141c2b"/>
      <circle cx="-6" cy="-20" r="4" fill="#ffe9a8"/>
      <circle cx="6" cy="-20" r="4" fill="#ffe9a8"/>
      <rect x="-2" y="-47" width="4" height="12" rx="2" fill="#16202f"/>
      <circle cx="0" cy="-50" r="5" fill="#ffd166"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="180" rx="16" fill="#0e1626"/>
  <ellipse cx="200" cy="100" rx="300" ry="115" fill="url(#g6a)"/>
  <ellipse cx="690" cy="100" rx="300" ry="115" fill="url(#g6b)"/>

  <!-- шахматная доска -->
  <rect x="360" y="10" width="160" height="160" rx="8" fill="url(#chess)" stroke="#3a4a63" stroke-width="3"/>
  <!-- зоны Атаки -->
  <rect x="361" y="131" width="18" height="18" fill="#e2564f" opacity=".35"/>
  <rect x="362" y="132" width="16" height="16" fill="none" stroke="#ff6b60" stroke-width="2.6" stroke-dasharray="5 3"/>
  <rect x="501" y="91" width="18" height="18" fill="#4f8fe2" opacity=".35"/>
  <rect x="502" y="92" width="16" height="16" fill="none" stroke="#6fa8ff" stroke-width="2.6" stroke-dasharray="5 3"/>

  <!-- шахматные фигурки -->
  <g transform="translate(430,142)" fill="#f4f7ff" stroke="#2a3242" stroke-width="2">
    <circle cy="-16" r="7"/>
    <path d="M-8 -8 q8 -4 16 0 l5 16 h-26 z"/>
    <rect x="-13" y="8" width="26" height="6" rx="3"/>
  </g>
  <g transform="translate(470,102)" fill="#1d2637" stroke="#f4f7ff" stroke-width="2">
    <circle cy="-16" r="7"/>
    <path d="M-8 -8 q8 -4 16 0 l5 16 h-26 z"/>
    <rect x="-13" y="8" width="26" height="6" rx="3"/>
  </g>
  <g transform="translate(410,62)" fill="#1d2637" stroke="#f4f7ff" stroke-width="2">
    <rect x="-11" y="-16" width="22" height="24" rx="3"/>
    <rect x="-13" y="-22" width="26" height="8" rx="3"/>
    <rect x="-14" y="6" width="28" height="7" rx="3"/>
  </g>

  <use href="#golem6" transform="translate(232,112) scale(0.95)" style="color:#e2564f"/>
  <use href="#golem6" transform="translate(662,112) scale(0.95)" style="color:#4f8fe2"/>

  <!-- метка бота -->
  <g transform="translate(662,26)">
    <rect x="-26" y="-14" width="52" height="28" rx="14" fill="#131e33" stroke="#ff9a3c" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9a3c">МБ</text>
  </g>

  <!-- карточка программы бота -->
  <g transform="translate(740,26)">
    <rect width="118" height="72" rx="10" fill="#131e33" stroke="#ff9a3c" stroke-width="3.5"/>
    <text x="59" y="20" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="11" font-weight="700" fill="#ff9a3c">Программа для Бота</text>
    <rect x="12" y="30" width="94" height="15" rx="7" fill="#57b45a"/>
    <rect x="12" y="50" width="70" height="15" rx="7" fill="#4f8fe2"/>
  </g>
</svg>
