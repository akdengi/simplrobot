<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Препросмотр фигурок STL</title>
<style>
  body { margin: 0; background: #101827; color: #dde7fb; font: 14px/1.4 system-ui, sans-serif; }
  #c { display: block; }
  #hint { position: fixed; left: 12px; top: 10px; z-index: 2; }
</style>
</head>
<body>
<div id="hint">Слева направо: как в файле · rotX(-90°) · rotX(+90°) · rotZ(-90°)<br>
Стрелка на полу показывает «вперёд» (+Z, к камере) </div>
<canvas id="c"></canvas>
<script src="../lib/three.min.js"></script>
<script src="../lib/STLLoader.js"></script>
<script>
  // Отладочная страница: показывает варианты ориентации акриловой фигурки.
  const T = window.THREE;
  const renderer = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x101827);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 4.2, 7.6);
  camera.lookAt(0, 0.9, 0);
  scene.add(new T.HemisphereLight(0xffffff, 0x334466, 0.9));
  const d = new T.DirectionalLight(0xffffff, 0.9); d.position.set(3, 6, 5); scene.add(d);

  // шахматный пол
  for (let r = 0; r < 4; r++) for (let c = 0; c < 12; c++) {
    const m = new T.Mesh(new T.BoxGeometry(0.98, 0.06, 0.98), new T.MeshStandardMaterial({ color: (r + c) % 2 ? 0xcda055 : 0x2e76c9 }));
    m.position.set(c - 5.5, -0.03, r - 1.5);
    scene.add(m);
  }
  // стрелка «вперёд» (+Z)
  const arrow = new T.Mesh(new T.ConeGeometry(0.22, 0.6, 12), new T.MeshStandardMaterial({ color: 0xff5555 }));
  arrow.position.set(0, 0.2, 2.2); arrow.rotation.x = Math.PI / 2; scene.add(arrow);

  const variants = [
    ['файл', (g) => g],
    ['rotX-90', (g) => g.rotateX(-Math.PI / 2)],
    ['rotX+90', (g) => g.rotateX(Math.PI / 2)],
    ['rotZ-90', (g) => g.rotateZ(-Math.PI / 2)],
  ];
  const params = new URLSearchParams(location.search);
  const file = params.get('f') || 'Figurine Red.stl';
  const only = params.get('v');
  if (params.get('side')) { camera.position.set(6.4, 3.4, 0.9); camera.lookAt(0, 0.9, 0); }
  if (params.get('view') === 'front') { camera.position.set(0, 1.8, 3.4); camera.lookAt(0, 1.7, 0); }
  if (params.get('view') === 'back') { camera.position.set(0, 1.8, -3.4); camera.lookAt(0, 1.7, 0); }
  const loader = new T.STLLoader();
  loader.load('../stl/' + encodeURIComponent(file), (geo) => {
    variants.forEach(([name, rot], i) => {
      if (only != null && only !== 'all' && Number(only) !== i) return;
      const off = only != null && only !== 'all' ? 0 : (i - 1.5) * 2.6;
      const g = geo.clone();
      rot(g);
      g.computeBoundingBox();
      const bb = g.boundingBox, c = new T.Vector3(); bb.getCenter(c);
      g.translate(-c.x, -bb.min.y, -c.z);
      g.computeBoundingBox();
      const size = new T.Vector3(); g.boundingBox.getSize(size);
      const s = Math.min(1.6 / Math.max(size.y, 1e-6), 1.3 / Math.max(size.x, size.z, 1e-6));
      g.scale(s, s, s);
      g.computeVertexNormals();
      const m = new T.Mesh(g, new T.MeshPhysicalMaterial({
        color: 0xd9534f, transparent: true, opacity: 0.62, roughness: 0.15, metalness: 0,
        clearcoat: 1, clearcoatRoughness: 0.08, side: T.DoubleSide, depthWrite: false,
      }));
      m.position.set(off, 0, 0);
      scene.add(m);
      const label = new T.Mesh(new T.PlaneGeometry(2.3, 0.4), new T.MeshBasicMaterial({ color: 0x223355 }));
      label.position.set(off, 0.05, 1.9); label.rotation.x = -Math.PI / 2;
      scene.add(label);
      console.log(name, 'size', size.x.toFixed(2), size.y.toFixed(2), size.z.toFixed(2));
    });
  }, undefined, (e) => console.error('stl fail', e));

  (function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
