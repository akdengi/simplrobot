<!-- Custom Stock Display Script (Tilda t-store) -->
<script>
$(document).ready(function () {

  const STOCK_INFO_CLASS = 'custom-stock-info';

  function getInvFromContext($ctx) {
    // 1) сам элемент
    let v = $ctx.attr('data-product-inv');
    // 2) ближайший родитель с атрибутом
    if (v === undefined) v = $ctx.closest('[data-product-inv]').attr('data-product-inv');
    // 3) любой потомок с атрибутом (на случай попапа/другой верстки)
    if (v === undefined) v = $ctx.find('[data-product-inv]').first().attr('data-product-inv');

    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : null;
  }

  function buildStockText(inv) {
    if (inv === null) return null;
    if (inv > 100) return 'На складе: Много';
    return 'На складе: ' + inv + ' шт.';
  }

  function renderStockInCard($card) {
    // Вырезаем ранее добавленное
    $card.find('.' + STOCK_INFO_CLASS).remove();

    const inv = getInvFromContext($card);
    const text = buildStockText(inv);
    if (!text) return;

    // Цена в карточке (в вашей разметке используется t-store__card__price)
    const $price = $card.find('.t-store__card__price').first();
    if (!$price.length) return;

    $('<div>', { class: STOCK_INFO_CLASS, text: text }).insertAfter($price);
  }

  function renderStockInPopup($popup) {
    // Вырезаем ранее добавленное в попапе
    $popup.find('.' + STOCK_INFO_CLASS).remove();

    const inv = getInvFromContext($popup);
    const text = buildStockText(inv);
    if (!text) return;

    // Цена в попапе (варианты классов у Tilda могут отличаться)
    const $price = $popup.find('.t-store__prod-popup__price, .t-store__prod-popup__price-wrapper, .t-store__prod-popup__price-value').first();
    if (!$price.length) return;

    $('<div>', { class: STOCK_INFO_CLASS, text: text }).insertAfter($price);
  }

  function updateAllStock() {
    // Каталог / сетка
    $('.js-store-grid-cont .t-store__card').each(function () {
      renderStockInCard($(this));
    });

    // Попап товара (если он есть/открывается)
    $('.t-store__prod-popup, .t-popup').each(function () {
      renderStockInPopup($(this));
    });
  }

  // 1) Первый запуск
  updateAllStock();

  // 2) На подгрузку/перерисовку: MutationObserver (надёжнее таймеров)
  const observer = new MutationObserver(function (mutations) {
    // чтобы не спамить перерисовкой — чуть задебаунсим
    clearTimeout(window.__stockDebounceTimer);
    window.__stockDebounceTimer = setTimeout(updateAllStock, 100);
  });

  observer.observe(document.body, { childList: true, subtree: true });

  // 3) На пользовательские действия (фильтры/сортировка/подгрузка)
  $(document).on('click change', '.js-store-filter, .js-store-filter-chosen-item, .js-store-load-more-btn, .js-store-parts-switcher, .t-store__sort-select', function () {
    setTimeout(updateAllStock, 200);
  });

});
</script>
